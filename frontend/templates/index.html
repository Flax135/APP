<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reselling Arbitrage Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reselling Arbitrage Agent</h1>
            <p>Finde profitable Deals auf eBay & Kleinanzeigen</p>
        </header>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Produkt suchen (z.B. iPhone 15, PS5, Nike Air Max...)" autofocus>
            <input type="number" id="max-price" placeholder="Max. Preis €" min="0" step="1">
            <select id="platform-select">
                <option value="ebay,kleinanzeigen">Alle Plattformen</option>
                <option value="ebay">Nur eBay</option>
                <option value="kleinanzeigen">Nur Kleinanzeigen</option>
            </select>
            <button class="btn" id="search-btn">Suchen</button>
        </div>

        <div id="stats-bar" class="stats-bar"></div>
        <div id="deals-grid" class="deals-grid">
            <div class="empty-state">
                <p>Suche nach einem Produkt, um Deals zu finden.</p>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
